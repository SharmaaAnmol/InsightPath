# Job Designation Role Family Mapping Configuration
role_families:
  - "Data Scientist"
  - "Data Analyst"
  - "Business Analyst"
  - "Data Engineer"
  - "BI Developer"
  - "Non-Analytics/Other"

matching_order_and_rules:
  1_Data_Scientist:
    regex: "\\b(data scientist|machine learning|ml engineer|deep learning|ai scientist|ai engineer|nlp engineer)\\b"
    precedence: 1
    description: "Core statistical modeling, AI, ML, and predictive analytics roles"
  2_Data_Engineer:
    regex: "\\b(data engineer|big data|etl|hadoop|data warehouse|spark developer|database engineer)\\b"
    precedence: 2
    description: "Data infrastructure, pipeline, ETL, and distributed computing roles"
  3_BI_Developer:
    regex: "\\b(bi developer|business intelligence|tableau|power bi|powerbi|dashboard|qlik|reporting analyst|bi analyst)\\b"
    precedence: 3
    description: "Business intelligence, dashboard development, reporting, and visualization roles"
  4_Data_Analyst:
    regex: "\\b(data analyst|statistical analyst|analytics specialist|analytics consultant|quantitative analyst|marketing analytics|financial analytics|risk analyst)\\b"
    precedence: 4
    description: "Quantitative analysis, business metrics exploration, and statistical analysis roles"
  5_Business_Analyst:
    regex: "\\b(business analyst|business analytics|process analyst|functional analyst|systems analyst)\\b"
    precedence: 5
    description: "Domain analysis, business requirements, and operational analytics roles"
  6_Non_Analytics_Other:
    fallback: true
    precedence: 6
    description: "Non-data scraping noise (sales, marketing, data entry, telecalling, IT support, SEO) or ambiguous roles"
