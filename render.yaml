# ==============================================================================
# Render Blueprint Specification
# InsightPath / RUSTY WOLVES FastAPI Production Deployment
# ==============================================================================
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: insightpath-backend
    env: python
    region: oregon
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000"
      - key: API_V1_STR
        value: /api/v1
